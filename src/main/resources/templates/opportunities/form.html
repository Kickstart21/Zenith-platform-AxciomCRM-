<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<div th:replace="~{layout/main :: html (content=~{::div#oppFormContent}, title=(${opportunityDto.opportunityId != null ? 'Edit Opportunity' : 'New Opportunity'}))}">
    <div id="oppFormContent">
        <!-- Title Bar -->
        <section class="section is-title-bar">
            <div class="level">
                <div class="level-left">
                    <div class="level-item">
                        <ul>
                            <li>Zenith</li>
                            <li><a th:href="@{/opportunities}">Opportunities</a></li>
                            <li th:text="${opportunityDto.opportunityId != null ? 'Edit' : 'Create'}">Create</li>
                        </ul>
                    </div>
                </div>
                <div class="level-right">
                    <div class="level-item">
                        <a th:href="@{/opportunities}" class="button is-light">
                            <span class="icon"><i class="mdi mdi-arrow-left"></i></span>
                            <span>Back to List</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Hero Bar -->
        <section class="hero is-hero-bar">
            <div class="hero-body">
                <div class="level">
                    <div class="level-left">
                        <div class="level-item">
                            <h1 class="title" th:text="${opportunityDto.opportunityId != null ? 'Edit Opportunity: ' + opportunityDto.opportunityName : 'Create New Opportunity'}">Opportunity Form</h1>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Main Section -->
        <section class="section is-main-section">
            <div class="card">
                <header class="card-header">
                    <p class="card-header-title">
                        <span class="icon"><i class="mdi mdi-ballot"></i></span>
                        Deal Configuration
                    </p>
                </header>
                <div class="card-content">
                    <form th:action="${opportunityDto.opportunityId != null} ? @{/opportunities/{id}/edit(id=${opportunityDto.opportunityId})} : @{/opportunities/create}"
                          th:object="${opportunityDto}" method="post">

                        <!-- Opportunity Name -->
                        <div class="field is-horizontal">
                            <div class="field-label is-normal">
                                <label class="label">Opportunity Name *</label>
                            </div>
                            <div class="field-body">
                                <div class="field">
                                    <div class="control has-icons-left">
                                        <input class="input" type="text" th:field="*{opportunityName}"
                                               th:classappend="${#fields.hasErrors('opportunityName')} ? 'is-danger' : ''"
                                               placeholder="e.g. Enterprise Cloud ERP Migration" required maxlength="150">
                                        <span class="icon is-small is-left"><i class="mdi mdi-briefcase"></i></span>
                                    </div>
                                    <p class="help is-danger" th:if="${#fields.hasErrors('opportunityName')}" th:errors="*{opportunityName}">Opportunity Name is required.</p>
                                </div>
                            </div>
                        </div>

                        <!-- Customer & Stage -->
                        <div class="field is-horizontal">
                            <div class="field-label is-normal">
                                <label class="label">Customer & Stage *</label>
                            </div>
                            <div class="field-body">
                                <div class="field">
                                    <div class="control">
                                        <div class="select is-fullwidth" th:classappend="${#fields.hasErrors('customerId')} ? 'is-danger' : ''">
                                            <select th:field="*{customerId}" required>
                                                <option value="">-- Select Customer Account --</option>
                                                <option th:each="c : ${customers}" th:value="${c.customerId}" th:text="${c.customerName + ' (' + c.customerCode + ')'}">Customer</option>
                                            </select>
                                        </div>
                                    </div>
                                    <p class="help is-danger" th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}">Customer is required.</p>
                                </div>
                                <div class="field">
                                    <div class="control">
                                        <div class="select is-fullwidth">
                                            <select th:field="*{stage}" onchange="updateDefaultProbability(this.value)">
                                                <option th:each="stg : ${stages}" th:value="${stg}" th:text="${stg.label}">Stage</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Deal Amount & Win Probability -->
                        <div class="field is-horizontal">
                            <div class="field-label is-normal">
                                <label class="label">Amount & Win % *</label>
                            </div>
                            <div class="field-body">
                                <div class="field">
                                    <div class="control has-icons-left">
                                        <input class="input" type="number" step="0.01" min="0.01" th:field="*{amount}"
                                               th:classappend="${#fields.hasErrors('amount')} ? 'is-danger' : ''"
                                               placeholder="Deal Amount (INR)" required>
                                        <span class="icon is-small is-left"><i class="mdi mdi-currency-inr"></i></span>
                                    </div>
                                    <p class="help is-danger" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">Opportunity Amount must be greater than 0.</p>
                                </div>
                                <div class="field">
                                    <div class="control has-icons-left">
                                        <input class="input" type="number" min="0" max="100" id="probability" th:field="*{probability}"
                                               th:classappend="${#fields.hasErrors('probability')} ? 'is-danger' : ''"
                                               placeholder="Win Probability (0-100%)" required>
                                        <span class="icon is-small is-left"><i class="mdi mdi-percent"></i></span>
                                    </div>
                                    <p class="help is-danger" th:if="${#fields.hasErrors('probability')}" th:errors="*{probability}">Probability must be between 0 and 100.</p>
                                </div>
                            </div>
                        </div>

                        <!-- Expected Close Date & Assigned To -->
                        <div class="field is-horizontal">
                            <div class="field-label is-normal">
                                <label class="label">Close Date & Rep</label>
                            </div>
                            <div class="field-body">
                                <div class="field">
                                    <div class="control has-icons-left">
                                        <input class="input" type="date" th:field="*{expectedCloseDate}"
                                               th:classappend="${#fields.hasErrors('expectedCloseDate')} ? 'is-danger' : ''" required>
                                        <span class="icon is-small is-left"><i class="mdi mdi-calendar"></i></span>
                                    </div>
                                    <p class="help is-danger" th:if="${#fields.hasErrors('expectedCloseDate')}" th:errors="*{expectedCloseDate}">Close date cannot be in the past.</p>
                                </div>
                                <div class="field">
                                    <div class="control has-icons-left">
                                        <input class="input" type="text" th:field="*{assignedTo}"
                                               placeholder="e.g. sales@acxiom.com (leave blank for self)">
                                        <span class="icon is-small is-left"><i class="mdi mdi-account-tie"></i></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr>

                        <!-- Action Buttons -->
                        <div class="field is-horizontal">
                            <div class="field-label"></div>
                            <div class="field-body">
                                <div class="field is-grouped">
                                    <div class="control">
                                        <button type="submit" class="button is-primary">
                                            <span class="icon"><i class="mdi mdi-check"></i></span>
                                            <span>Save Opportunity</span>
                                        </button>
                                    </div>
                                    <div class="control">
                                        <a th:href="@{/opportunities}" class="button is-light">Cancel</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <script>
            function updateDefaultProbability(stage) {
                const probInput = document.getElementById('probability');
                if (!probInput) return;
                const map = {
                    'QUALIFICATION': 20,
                    'PROPOSAL': 50,
                    'NEGOTIATION': 75,
                    'WON': 100,
                    'LOST': 0
                };
                if (map[stage] !== undefined) {
                    probInput.value = map[stage];
                }
            }
        </script>
    </div>
</div>

</body>
</html>
