<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notice — Zenith</title>

    <link rel="stylesheet" th:href="@{/css/main.min.css}">
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdn.materialdesignicons.com/4.9.95/css/materialdesignicons.min.css">
    <style>
        body {
            background-color: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', sans-serif;
        }
        .error-card {
            max-width: 480px;
            width: 100%;
            padding: 1.5rem;
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="card has-text-centered">
        <div class="card-content py-6">
            <div class="has-text-danger mb-4">
                <span class="icon is-large"><i class="mdi mdi-alert-circle-outline mdi-48px"></i></span>
            </div>
            <h1 class="title is-4" th:text="${statusCode != null ? 'Error ' + statusCode : 'System Notice'}">System Notice</h1>
            <p class="subtitle is-6 has-text-grey mt-2" th:text="${errorMessage != null ? errorMessage : 'The requested resource could not be found or processed.'}">
                An error occurred during request processing.
            </p>
            <div class="buttons is-centered mt-5">
                <a th:href="@{/dashboard}" class="button is-primary">
                    <span class="icon"><i class="mdi mdi-view-dashboard"></i></span>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/login}" class="button is-light">
                    <span class="icon"><i class="mdi mdi-login"></i></span>
                    <span>Sign In</span>
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
